<html lang="de"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Pixora Premium</title>
    <script src="./Pixora Premium Endversion 0.2_files/qrcode.min.js"></script><style type="text/css" id="operaUserStyle"></style>
    <style>
        :root {
            --bg: #ffffff; --text: #000000; --secondary: #8e8e8e;
            --border: #dbdbdb; --btn: #efefef; --input: #fafafa;
            --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000; --text: #ffffff; --secondary: #a8a8a8;
                --border: #262626; --btn: #363636; --input: #121212;
            }
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; }
        .container { max-width: 600px; margin: auto; padding: 15px; }

        /* Header & Notes */
        .header { display: flex; align-items: center; margin-top: 15px; }
        .pic-area { flex: 1; text-align: center; position: relative; }
        .note { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); background: var(--btn); padding: 4px 10px; border-radius: 15px; font-size: 11px; border: 1px solid var(--border); cursor: pointer; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .circle { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #ff3040; padding: 3px; object-fit: cover; cursor: pointer; }
        .stats { flex: 2; display: flex; justify-content: space-around; text-align: center; }
        .stat-num { display: block; font-weight: bold; font-size: 18px; cursor: pointer; }

        /* Buttons & Stories */
        .btn { background: var(--btn); border: none; border-radius: 8px; padding: 10px; font-weight: 600; color: var(--text); cursor: pointer; width: 100%; font-size: 14px; }
        .stories { display: flex; gap: 15px; overflow-x: auto; padding: 15px 0; border-bottom: 1px solid var(--border); }
        .s-item { text-align: center; font-size: 11px; min-width: 65px; cursor: pointer; }
        .s-circle { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #ff3040; display: flex; align-items: center; justify-content: center; background: var(--input); margin: 0 auto 4px; overflow: hidden; }
        .s-circle img { width: 100%; height: 100%; object-fit: cover; }

        /* Grid Feed */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 10px; }
        .grid-item { aspect-ratio: 1/1; background: var(--input); position: relative; cursor: pointer; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }
        .quick-del { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; z-index: 5; font-size: 12px; }

        /* Lightbox (Vollansicht) */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 3000; flex-direction: column; justify-content: center; align-items: center; }
        #lb-content { width: 100%; height: 60vh; display: flex; justify-content: center; position: relative; }
        #lb-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.3); color: white; border: none; padding: 15px; border-radius: 50%; cursor: pointer; font-size: 20px; z-index: 10; }

        /* Overlays & Modals */
        #overlay, #qr-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 4000; justify-content: center; align-items: center; }
        .modal { background: var(--bg); padding: 25px; border-radius: 20px; width: 85%; max-width: 380px; text-align: center; border: 1px solid var(--border); }
        
        /* QR Card Style */
        .qr-card { background: var(--insta-grad); padding: 40px 20px; border-radius: 30px; text-align: center; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #qrcode { background: white; padding: 15px; border-radius: 15px; display: inline-block; margin: 20px 0; }
    </style>
</head>

        <button class="btn" style="background:rgba(255,255,255,0.2); color:white; border:1px solid white;" onclick="document.getElementById(&#39;qr-overlay&#39;).style.display=&#39;none&#39;">Schließen</button>

<script>
    let posts = JSON.parse(localStorage.getItem("pix_posts") || "[]");
    let stories = JSON.parse(localStorage.getItem("pix_stories") || "[]");
    let activeIdx = 0;

    window.onload = () => {
        document.getElementById('name-display').innerText = localStorage.getItem("pix_name") || "Dein Name";
        document.getElementById('fol-num').innerText = localStorage.getItem("pix_fol") || "0";
        document.getElementById('gef-num').innerText = localStorage.getItem("pix_gef") || "0";
        document.getElementById('bio-display').innerText = localStorage.getItem("pix_bio") || "Tippe für Bio...";
        document.getElementById('note-text').innerText = localStorage.getItem("pix_note") || "Notiz...";
        if(localStorage.getItem("pix_pic")) document.getElementById('profile-pic').src = localStorage.getItem("pix_pic");
        renderFeed(); renderStories();

        window.onkeydown = (e) => {
            if(document.getElementById('lightbox').style.display === 'flex') {
                if(e.key === "ArrowLeft") navPosts(-1);
                if(e.key === "ArrowRight") navPosts(1);
                if(e.key === "Escape") document.getElementById('lightbox').style.display='none';
            }
        };
    };

    function renderFeed() {
        const f = document.getElementById('feed'); f.innerHTML = "";
        document.getElementById('post-count').innerText = posts.length;
        posts.forEach((p, i) => {
            const d = document.createElement('div'); d.className="grid-item";
            d.innerHTML = `<button class="quick-del" onclick="delPost(${i}, event)">✕</button><img src="${p.data}" onclick="showLightbox(${i})">`;
            f.appendChild(d);
        });
    }

    function showLightbox(i) { activeIdx = i; document.getElementById('lb-img').src = posts[i].data; document.getElementById('lightbox').style.display='flex'; }
    function navPosts(dir) { activeIdx = (activeIdx + dir + posts.length) % posts.length; document.getElementById('lb-img').src = posts[activeIdx].data; }
    
    function delPost(i, e) { e.stopPropagation(); if(confirm("Beitrag unwiderruflich löschen?")) { posts.splice(i, 1); sync(); renderFeed(); } }
    function reportCurrentPost() { if(confirm("Beitrag wegen Verstoß melden und entfernen?")) { posts.splice(activeIdx, 1); sync(); renderFeed(); document.getElementById('lightbox').style.display='none'; } }

    function uploadPost() {
        const r = new FileReader(); r.onload = (e) => { posts.unshift({data: e.target.result}); sync(); renderFeed(); };
        r.readAsDataURL(document.getElementById('post-file').files[0]);
    }

    function openQR() {
        const user = (localStorage.getItem("pix_name") || "user").toLowerCase().replace(/\s/g, '');
        document.getElementById('qr-user-label').innerText = "@" + user;
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById('qrcode'), {text: window.location.href, width: 180, height: 180});
        document.getElementById('qr-overlay').style.display='flex';
    }

    function uploadStoryImg() {
        const input = document.createElement('input'); input.type='file';
        input.onchange=(e)=>{ const r=new FileReader(); r.onload=(ev)=>{ stories.push({type:'img', data:ev.target.result}); saveS(); }; r.readAsDataURL(e.target.files[0]); };
        input.click();
    }

    function createTextStory() {
        const t = prompt("Was möchtest du schreiben?");
        const bg = prompt("Hintergrundfarbe (z.B. blue, black, orange):", "deeppink");
        if(t) { stories.push({type:'text', data:t, bg:bg}); saveS(); }
    }

    function renderStories() {
        const l = document.getElementById('story-bar');
        stories.forEach(s => {
            const d = document.createElement('div'); d.className="s-item";
            d.innerHTML = `<div class="s-circle">${s.type==='img'?`<img src="${s.data}">`:'Aa'}</div>Story`;
            l.appendChild(d);
        });
    }

    function setStat(k, l) { const v = prompt(l); if(v!==null) { localStorage.setItem(k, v); location.reload(); } }
    function sync() { localStorage.setItem("pix_posts", JSON.stringify(posts)); }
    function saveS() { localStorage.setItem("pix_stories", JSON.stringify(stories)); location.reload(); }
    function updateProfilePic() { const r=new FileReader(); r.onload=(e)=>{ localStorage.setItem("pix_pic", e.target.result); location.reload(); }; r.readAsDataURL(document.getElementById('p-file').files[0]); }
</script>
